<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Σελίδα Μετρήσεων</title>
    
    <style>
        .button-container {
          display: flex;
          flex-direction: column;
          align-items: flex-start;
        }
    
        .button {
          --main-color: #04AA6D;
          border: 2px solid var(--main-color);
          background-color: white;
          color: black;
          padding: 16px 32px;
          text-align: center;
          font-size: 16px;
          margin: 5px;
          text-decoration: none;
          transition-duration: 0.5s;
          cursor: pointer;
        }

        .button:hover {
          background-color: var(--main-color);
          color: white;
        }
    </style>
  </head>
  <body class="button-container">
     <p>Γεια σου {{g.user[1]}}</p>
     
     <p>Temperature: {{ roundv(g.s.temperature,2) }} ºC</p>
     <p>Humidity: {{ roundv(g.s.humidity,1) }} %</p>
     <p>Pressure: {{ roundv(g.s.pressure, 3)}} mbar</p>
     
     <a class="button" style="--main-color: #e1f719;" href="{{ url_for('homepage') }}">Homepage</a>
  </body>
</html>
